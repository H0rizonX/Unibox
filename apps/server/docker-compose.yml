services:
  mysql:
    image: mysql:8.4
    container_name: unibox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: unibox
      MYSQL_USER: unibox
      MYSQL_PASSWORD: unibox123
    ports:
      - '3306:3306'
    volumes:
      - unibox_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: unibox-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - unibox_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  unibox_mysql_data:
  unibox_redis_data:
